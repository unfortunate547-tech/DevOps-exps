E<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Registration</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(135deg,#1d0d38,#3d1766,#6d28d9);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    overflow:hidden;
}

/* Background glow */
body::before{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    background:#c084fc;
    border-radius:50%;
    filter:blur(180px);
    top:-150px;
    left:-150px;
    opacity:.4;
}

body::after{
    content:"";
    position:absolute;
    width:400px;
    height:400px;
    background:#8b5cf6;
    border-radius:50%;
    filter:blur(160px);
    bottom:-120px;
    right:-120px;
    opacity:.3;
}

.container{
    position:relative;
    z-index:1;
    width:400px;
    padding:35px;
    border-radius:20px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.15);
    box-shadow:0 15px 35px rgba(0,0,0,.4);
    color:white;
}

h2{
    text-align:center;
    margin-bottom:25px;
    font-size:30px;
    letter-spacing:2px;
}

p{
    text-align:center;
    color:#ddd;
    margin-bottom:25px;
    font-size:14px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    font-weight:600;
}

input,select{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:rgba(255,255,255,.12);
    color:white;
    font-size:15px;
    outline:none;
}

input::placeholder{
    color:#ddd;
}

input:focus,select:focus{
    border:1px solid #c084fc;
    box-shadow:0 0 12px rgba(192,132,252,.6);
}

select{
    color:white;
}

select option{
    color:black;
}

/* Purple Register Button */
button{
    width:100%;
    margin-top:25px;
    padding:14px;
    border:none;
    border-radius:12px;
    background:linear-gradient(90deg,#7e22ce,#a855f7,#c084fc);
    color:white;
    font-size:17px;
    font-weight:bold;
    letter-spacing:1px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 20px rgba(168,85,247,.45);
}

#message{
    margin-top:18px;
    text-align:center;
    color:#f5d0fe;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="container">
    <h2>EVENT REGISTRATION</h2>
    <p>Reserve your spot today.</p>

    <form id="registerForm">

        <label>Full Name</label>
        <input type="text" placeholder="Enter your name" required>

        <label>Email Address</label>
        <input type="email" placeholder="Enter your email" required>

        <label>Phone Number</label>
        <input type="tel" placeholder="Enter your phone number" required>

        <label>Select Event</label>
        <select required>
            <option value="">Choose an event</option>
            <option>Music Festival</option>
            <option>Fan Meetup</option>
            <option>Workshop</option>
            <option>Concert Night</option>
        </select>

        <button type="submit">💜 Register 💜</button>

    </form>

    <div id="message"></div>

</div>

<script>
document.getElementById("registerForm").addEventListener("submit",function(e){
    e.preventDefault();
    document.getElementById("message").innerHTML =
    "✨ Registration Successful! See you at the event. ✨";
    this.reset();
});
</script>

</body>
</html>
